name: ZAP baseline

# Passive security scan of production (PLAN.md §16): ZAP spiders
# dayrule.app with GET requests only and reports missing or weak headers,
# cookies and similar. It sends nothing the Firewall rate limits match
# (they only cover POSTs to auth endpoints). Weekly, on demand, and on PRs
# that change this scan.

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/zap.yml
      - .zap/**

permissions:
  contents: read

jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Third-party action with access to the runner: pinned to a commit.
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://dayrule.app
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-report
